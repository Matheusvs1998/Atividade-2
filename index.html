<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilherme de Sá</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav ul {
            background: #444;
            padding: 10px;
            list-style: none;
            text-align: center;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        section {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
        }
        video, audio {
            display: block;
            margin: 10px 0;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem vindo</h1>
        <h2>Atividade de numero 2</h2>
        <p>Pagina feita em homenagem ao Guilherme de Sá</p>
    </header>

    <nav>
        <ul>
            <li><a href="#introducao">Início</a></li>
            <li><a href="#midia">Mídia</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    </nav>

    <main>
        <section id="introducao">
            <h3>Sobre este projeto</h3>
            <p>Musicas do cantor Guilherme de Sá</p>
        </section>

        <section id="midia">
            <h3>Galeria Multimídia</h3>
            
            <h4>Exemplo de Vídeo</h4>
            <video controls width="400">
                <source src="midias/03 Guilherme de Sá - Onze (Vídeo Oficial).mp4" type="video/mp4">

            </video>

            <h4>Exemplo de Áudio</h4>
            <audio controls>
                <source src="midias/01 Guilherme de Sá - Poema de Niemöller.mp3" type="audio/mpeg">
                Seu navegador não suporta a tag de áudio.
            </audio>
        </section>
    </main>

    <footer>
